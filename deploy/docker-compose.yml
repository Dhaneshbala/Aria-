# ARIA on one Oracle Always Free Ampere VM.
# Caddy publishes 80/443; the gateway admin API answers on loopback only.
# Backend + Ollama + gateway stay on the private compose network. NOTE:
# agent terminal/file tools reject non-loopback callers, so on this box
# they are effectively disabled — safer for a public server.
name: aria

services:
  # Optional local-AI mode: `docker compose --profile local up -d`.
  # Claude-first default: the gateway answers instead (no model download).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [local]
    volumes:
      - ollama_models:/root/.ollama
    # no ports published — backend reaches it at http://ollama:11434

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    # The single Anthropic key + admin token live ONLY here (.env.gateway)
    env_file:
      - .env.gateway
    environment:
      GATEWAY_DB_PATH: /data/gateway.sqlite3
    volumes:
      - gateway_data:/data
    # unique admin port is reachable from the VM shell only, never the net
    ports:
      - "127.0.0.1:8088:8088"

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
        required: false   # optional profile — cloud mode has no ollama
    # Auth knobs, gateway token, consent and model names come from
    # .env.deploy (see deploy/.env.deploy.example). This file only carries
    # the container-internal wiring.
    env_file:
      - .env.deploy
    environment:
      OLLAMA_URL: http://ollama:11434
      ARIA_GATEWAY_URL: http://gateway:8088
      ARIA_DATA_DIR: /data
    volumes:
      - aria_data:/data
    # no ports published — only reachable via Caddy

  # Builds the PWA once into a shared volume, then exits.
  frontend-build:
    image: node:22-alpine
    working_dir: /src
    command: sh -c "npm ci --silent && VITE_API_URL=/api npm run build && rm -rf /out/* && cp -r dist/. /out/"
    volumes:
      - ../frontend:/src
      - frontend_dist:/out

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"   # used only when ARIA_TLS_DOMAIN is set (automatic TLS)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env.deploy   # only ARIA_TLS_DOMAIN is read here

volumes:
  gateway_data:
  ollama_models:
  aria_data:
  frontend_dist:
  caddy_data:
  caddy_config:
