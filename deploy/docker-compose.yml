# ARIA on one Oracle Always Free Ampere VM (4 OCPU / 24 GB RAM).
# Only Caddy's port 80 is published. Backend + Ollama stay on the private
# compose network. NOTE: agent terminal/file tools reject non-loopback
# callers, so on this box they are effectively disabled — safer for a
# public server.
name: aria

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # no ports published — backend reaches it at http://ollama:11434

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      - ollama
    # Auth knobs, model names and optional cloud consent come from
    # .env.deploy (see deploy/.env.deploy.example). This file only carries
    # the container-internal wiring.
    env_file:
      - .env.deploy
    environment:
      OLLAMA_URL: http://ollama:11434
      ARIA_DATA_DIR: /data
    volumes:
      - aria_data:/data
    # no ports published — only reachable via Caddy

  # Builds the PWA once into a shared volume, then exits.
  frontend-build:
    image: node:22-alpine
    working_dir: /src
    command: sh -c "npm ci --silent && VITE_API_URL=/api npm run build && rm -rf /out/* && cp -r dist/. /out/"
    volumes:
      - ../frontend:/src
      - frontend_dist:/out

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"   # used only when ARIA_TLS_DOMAIN is set (automatic TLS)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env.deploy   # only ARIA_TLS_DOMAIN is read here

volumes:
  ollama_models:
  aria_data:
  frontend_dist:
  caddy_data:
  caddy_config:
